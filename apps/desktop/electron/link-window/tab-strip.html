<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #202020;
    font-family: Segoe UI, -apple-system, sans-serif;
    font-size: 12px;
    color: #e6e6e6;
    -webkit-app-region: drag;
  }
  #tabs {
    display: flex;
    align-items: stretch;
    height: 36px;
    -webkit-app-region: drag;
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 220px;
    min-width: 120px;
    padding: 0 10px;
    border-right: 1px solid #333;
    cursor: default;
    -webkit-app-region: no-drag;
    white-space: nowrap;
    overflow: hidden;
  }
  .tab.active { background: #2f2f2f; }
  .tab:hover:not(.active) { background: #272727; }
  .tab-title {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tab-refresh,
  .tab-close {
    border: none;
    background: transparent;
    color: inherit;
    cursor: default;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .tab-refresh:hover { background: #3f3f3f; }
  .tab-close:hover { background: #c42b1c; color: #fff; }
</style>
</head>
<body>
  <div id="tabs"></div>
  <script src="tab-strip.js"></script>
</body>
</html>
