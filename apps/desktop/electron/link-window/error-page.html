<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e1e1e;
    color: #ccc;
    font-family: Segoe UI, -apple-system, sans-serif;
  }
  .box { text-align: center; }
  .url { color: #888; font-size: 12px; margin: 8px 0 16px; word-break: break-all; max-width: 480px; }
  button {
    background: #2f6fdb;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: #3a7ce0; }
</style>
</head>
<body>
  <div class="box">
    <div>Couldn't load this page.</div>
    <div class="url" id="url"></div>
    <button id="retry">Retry</button>
  </div>
  <script>
    const url = decodeURIComponent(location.hash.slice(1));
    document.getElementById('url').textContent = url;
    document.getElementById('retry').onclick = () => {
      let parsed;
      try { parsed = new URL(url); } catch { return; }
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return;
      location.href = parsed.href;
    };
  </script>
</body>
</html>
