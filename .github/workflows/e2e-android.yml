name: E2E Android (nightly)

# Android e2e needs an emulator (KVM), so it runs on a schedule / on demand rather
# than on every push. See apps/app/e2e/README.md.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  android:
    name: Appium smoke (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm -w apps/app run build
      - name: Sync Capacitor + assemble debug APK
        run: |
          cd apps/app
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - name: Run Appium smoke on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: npm -w apps/app run e2e:android
