name: Android APK release

# Builds the signed Android APK and publishes it as a GitHub Release tagged android-v<version>, which
# is what the app's in-app updater (Settings > Data & sync > App updates) looks for. For installs
# outside Google Play; the Play bundle is built by "Android release bundle". Run it by hand from the
# Actions tab. It uses the same "release" environment secrets as that workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown to users (for example 1.2.0); must be higher than the last release
        required: true

permissions:
  contents: read

jobs:
  apk:
    name: Signed release APK
    runs-on: ubuntu-latest
    environment: release
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Check the version name
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version name must look like 1.2.0"; exit 1; }
      - name: Check the signing secrets exist
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$K" ]  && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$P" ]  && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$A" ]  && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see docs/android-release.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: npm ci
      - run: npm -w apps/app run build
      - name: Sync Capacitor into the Android project
        working-directory: apps/app
        run: npx cap sync android
      - name: Write the signing config (kept out of the repo and the logs)
        working-directory: apps/app/android
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$K" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$P"
            echo "keyAlias=$A"
            echo "keyPassword=$KP"
          } > keystore.properties
      - name: Check the signing key is the one users already trust
        env:
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          fp=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env P -alias "$A" | awk '/SHA256:/{print $2; exit}')
          [ -n "$fp" ] || { echo "::error::Could not read the signing key's fingerprint"; exit 1; }
          norm() { echo "$1" | tr -d ': ' | tr 'a-f' 'A-F'; }
          echo "Signing key SHA-256: $fp"
          echo "Signing key SHA-256: \`$fp\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::ANDROID_CERT_SHA256 is not set, so the key is not checked. Set that variable (Settings > Secrets and variables > Actions > Variables) to $fp to lock it in."
          elif [ "$(norm "$fp")" != "$(norm "$EXPECTED")" ]; then
            echo "::error::This keystore is not the one users have installed (expected $EXPECTED, got $fp). An APK signed with it cannot update their app, and Play Protect treats a new key as a new, unknown developer."
            exit 1
          fi
      - name: Build the signed APK
        working-directory: apps/app/android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -Psideload "-PversionCode=$RUN_NUMBER" "-PversionName=$VERSION_NAME"
      - name: Check the APK is signed with that key (not unsigned, not the debug key)
        run: |
          apk=$(ls apps/app/android/app/build/outputs/apk/release/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -qi "Android Debug" "$RUNNER_TEMP/certs.txt" && { echo "::error::The APK is signed with the debug key"; exit 1; }
          apkfp=$(awk '/certificate SHA-256 digest/{print $NF; exit}' "$RUNNER_TEMP/certs.txt" | tr 'a-f' 'A-F')
          keyfp=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env P -alias "$A" | awk '/SHA256:/{print $2; exit}' | tr -d ':')
          [ -n "$apkfp" ] && [ "$apkfp" = "$keyfp" ] || { echo "::error::The APK's signature ($apkfp) is not the release key's ($keyfp)"; exit 1; }
        env:
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Remove the signing config
        if: always()
        run: rm -f apps/app/android/keystore.properties "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: nexusmd-android-apk
          path: apps/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  # Separate from the build so the token that can write releases never meets the signing secrets or
  # the third-party Gradle action.
  publish:
    name: Publish the GitHub release
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexusmd-android-apk
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_NAME: ${{ inputs.version_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          mv ./*.apk "nexusmd-android-$VERSION_NAME.apk"
          gh release create "android-v$VERSION_NAME" "nexusmd-android-$VERSION_NAME.apk" \
            --target "$TARGET_SHA" --title "Android $VERSION_NAME" --generate-notes
