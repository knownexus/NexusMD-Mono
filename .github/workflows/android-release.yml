name: Android release bundle

# Builds the signed Android App Bundle (.aab) that Google Play takes, and keeps it as a run artifact.
# Run it by hand from the Actions tab (Run workflow). It needs four repository secrets, set once:
#   ANDROID_KEYSTORE_BASE64  the upload keystore, base64-encoded (scripts/android-keystore.ps1 copies it)
# Add them as ENVIRONMENT secrets on an environment named "release", not as repository secrets.
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the run stops with a message saying which is missing. See docs/android-release.md.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version shown to users (for example 1.2.0)
        default: '1.2.0'
        required: true

permissions:
  contents: read

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-latest
    # The signing secrets belong to the "release" environment (Settings > Environments), limited to
    # master and requiring your approval, so a run from any other branch cannot read them.
    environment: release
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Check the version name
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version name must look like 1.2.0"; exit 1; }
      - name: Check the signing secrets exist
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$K" ]  && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$P" ]  && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$A" ]  && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (see docs/android-release.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: npm ci
      - run: npm -w apps/app run build
      - name: Sync Capacitor into the Android project
        working-directory: apps/app
        run: npx cap sync android
      - name: Write the signing config (kept out of the repo and the logs)
        working-directory: apps/app/android
        env:
          K: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$K" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$P"
            echo "keyAlias=$A"
            echo "keyPassword=$KP"
          } > keystore.properties
      - name: Check the signing key is the one users already trust
        env:
          P: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          A: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          fp=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass:env P -alias "$A" | awk '/SHA256:/{print $2; exit}')
          [ -n "$fp" ] || { echo "::error::Could not read the signing key's fingerprint"; exit 1; }
          norm() { echo "$1" | tr -d ': ' | tr 'a-f' 'A-F'; }
          echo "Signing key SHA-256: $fp"
          echo "Signing key SHA-256: \`$fp\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$EXPECTED" ]; then
            echo "::warning::ANDROID_CERT_SHA256 is not set, so the key is not checked. Set that variable (Settings > Secrets and variables > Actions > Variables) to $fp to lock it in."
          elif [ "$(norm "$fp")" != "$(norm "$EXPECTED")" ]; then
            echo "::error::This keystore is not the one users have installed (expected $EXPECTED, got $fp). An APK signed with it cannot update their app, and Play Protect treats a new key as a new, unknown developer."
            exit 1
          fi
      - name: Build the signed bundle
        working-directory: apps/app/android
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon "-PversionCode=$RUN_NUMBER" "-PversionName=$VERSION_NAME"
      - name: Remove the signing config
        if: always()
        run: rm -f apps/app/android/keystore.properties "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-release-${{ inputs.version_name }}-${{ github.run_number }}
          path: apps/app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
