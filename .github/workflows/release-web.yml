name: Release Web

# Builds the SPA into the ASP.NET host's wwwroot and publishes the self-contained host.
on:
  push:
    tags: ['web-v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      # Release build of the API runs the BuildFrontend MSBuild target, which invokes
      # `npm run build` in apps/web → server/wwwroot. Publish the host.
      - name: Publish ASP.NET host
        run: dotnet publish apps/web/server/NexusMDWeb.Api.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: web-host
          path: publish/**
