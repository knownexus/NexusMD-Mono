name: Release Desktop

# Ported from the original NexusMD-Desktop workflow. The obsolete NexusMD-Web
# sidecar checkout is removed (the desktop app no longer bundles the ASP.NET host —
# data comes from @nexusmd/core adapters). electron-builder publishes to GitHub Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-builder creates the GitHub Release on this repo with the built-in token.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm -w apps/desktop run build:win
          - os: macos-latest
            build_cmd: npm -w apps/desktop run build:mac
          - os: ubuntu-latest
            build_cmd: npm -w apps/desktop run build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # build:{win,mac,linux} build the Vite renderer then run electron-builder.
      - name: Package + publish
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/desktop/**
          if-no-files-found: ignore

  # Every platform uploads into a draft (releaseType in package.json and electron-builder.win.cjs);
  # it is published only once all of them have. Published as each finished, the release was the
  # latest before its latest.yml was there, and the app's updater got a 404. If any platform fails,
  # the release stays a draft rather than shipping without it.
  publish:
    name: Publish release
    needs: build
    # Only for a version tag: a manual run builds without publishing anything.
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # App updates (release-apps.yml) are listed in apps-index.json on the apps-latest release. It records
  # the newest NexusMD and the shell API it gives apps, so an app needing more than any published
  # NexusMD gives is refused rather than sent to copies that can't run it.
  apps-index:
    name: Record this release in the app index
    needs: publish
    runs-on: ubuntu-latest
    concurrency:
      group: apps-index
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # A pre-release, so it is never the "latest" release electron-updater takes NexusMD updates from.
      - name: Make sure the apps-latest release exists
        run: |
          gh release view apps-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create apps-latest --prerelease --latest=false --title "App updates" \
              --notes "Updates for the apps inside NexusMD, downloaded by the app itself. Not an installer." \
              --repo "$GITHUB_REPOSITORY"
      - name: Fetch the published index
        run: |
          mkdir -p release/current
          gh release download apps-latest --pattern apps-index.json --dir release/current --repo "$GITHUB_REPOSITORY" || true
      - name: Record and sign
        run: node apps/desktop/build/app-release.mjs shell --version "${GITHUB_REF_NAME#v}" --index release/current/apps-index.json --out release/out
        env:
          NEXUSMD_APPS_SIGNING_KEY: ${{ secrets.NEXUSMD_APPS_SIGNING_KEY }}
      - name: Publish
        run: gh release upload apps-latest release/out/apps-index.json release/out/apps-index.json.sig --clobber --repo "$GITHUB_REPOSITORY"
