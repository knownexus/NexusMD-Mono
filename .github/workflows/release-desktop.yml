name: Release Desktop

# Ported from the original NexusMD-Desktop workflow. The obsolete NexusMD-Web
# sidecar checkout is removed (the desktop app no longer bundles the ASP.NET host —
# data comes from @nexusmd/core adapters). electron-builder publishes to GitHub Releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-builder creates the GitHub Release on this repo with the built-in token.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_cmd: npm -w apps/desktop run build:win
          - os: macos-latest
            build_cmd: npm -w apps/desktop run build:mac
          - os: ubuntu-latest
            build_cmd: npm -w apps/desktop run build:linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # build:{win,mac,linux} build the Vite renderer then run electron-builder.
      - name: Package + publish
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: dist/desktop/**
          if-no-files-found: ignore

  # Every platform uploads into a draft (releaseType in package.json and electron-builder.win.cjs);
  # it is published only once all of them have. Published as each finished, the release was the
  # latest before its latest.yml was there, and the app's updater got a 404. If any platform fails,
  # the release stays a draft rather than shipping without it.
  publish:
    name: Publish release
    needs: build
    # Only for a version tag: a manual run builds without publishing anything.
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
