<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nexus-design-system-c39920c4-ff47-4772-bc50-4bbe29f6f2fa/colors_and_type.css">
  <link rel="stylesheet" href="_ds/nexus-design-system-c39920c4-ff47-4772-bc50-4bbe29f6f2fa/components.css">
  <link rel="stylesheet" href="_ds/nexus-design-system-c39920c4-ff47-4772-bc50-4bbe29f6f2fa/brand-profiles/profiles.css">
  <link rel="stylesheet" href="_ds/nexus-design-system-c39920c4-ff47-4772-bc50-4bbe29f6f2fa/styles.css">
  <script src="_ds/nexus-design-system-c39920c4-ff47-4772-bc50-4bbe29f6f2fa/_ds_bundle.js"></script>
  <style>span, p, label { font-family: inherit; }</style>
</helmet>
<div style="display:flex;flex-direction:column;background:var(--container-bg);border-bottom:1px solid var(--border);font-family:var(--font-ui);color:var(--text);white-space:nowrap;">
  <div style="display:flex;align-items:center;gap:12px;padding:10px 16px 4px;min-width:0;">
    <span style="font:600 16px var(--font-ui);color:var(--text-bright);">master</span>
    <span style="display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border:1px solid var(--border);border-radius:5px;color:var(--text-muted);font-size:11.5px;">Switch<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"></path></svg></span>
    <span style="display:inline-flex;align-items:center;gap:10px;min-width:0;font-size:12px;color:var(--text-muted);overflow:hidden;">
      <span>origin/master</span>
      <span style="color:{{ syncColor }};">{{ syncText }}</span>
      <span title="C:/repos/NexusMD-Mono/master" style="display:inline-flex;align-items:center;gap:5px;font:11.5px 'Geist Mono',ui-monospace,monospace;">C:/repos/NexusMD-Mono/master<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></span>
    </span>
    <span style="flex:1;"></span>
    <div style="display:flex;align-items:center;gap:6px;">
      <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--container-raised);font:500 12px var(--font-ui);">Fetch</span>
      <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--container-raised);font:500 12px var(--font-ui);opacity:{{ opDim }};">Pull...</span>
      <span style="display:inline-flex;align-items:center;height:26px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--container-raised);font:500 12px var(--font-ui);opacity:{{ opDim }};">Rebase...</span>
      <span style="display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:6px;background:var(--container-raised);font:500 12px var(--font-ui);">More<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"></path></svg></span>
      <span style="width:1px;height:16px;background:var(--border);margin:0 2px;"></span>
      <span title="Terminal" style="display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--text-muted);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" x2="20" y1="19" y2="19"></line></svg></span>
      <span title="Editor" style="display:grid;place-items:center;width:26px;height:26px;border-radius:6px;color:var(--text-muted);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span>
    </div>
  </div>
  <div style="display:flex;align-items:flex-end;gap:2px;padding:0 12px;height:34px;">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <span style="display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-bottom:2px solid {{ t.bd }};color:{{ t.c }};font:600 12.5px var(--font-ui);">{{ t.label }}<span style="font-weight:500;font-size:11px;color:var(--text-muted);">{{ t.n }}</span></span>
    </sc-for>
    <span style="flex:1;"></span>
    <span style="display:inline-flex;align-items:center;gap:8px;height:26px;margin-bottom:4px;padding:0 8px;color:var(--text-muted);font-size:12px;">Go to file<span style="padding:0 5px;border:1px solid var(--border);border-radius:4px;font:10.5px 'Geist Mono',ui-monospace,monospace;">Ctrl P</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1160,&quot;height&quot;:84},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;changes&quot;,&quot;history&quot;,&quot;files&quot;],&quot;default&quot;:&quot;changes&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;6&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;op&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;rebase&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'changes';
    const op = this.props.op === 'rebase';
    const count = this.props.count ?? '';
    const tabs = [['changes', 'Changes', count], ['history', 'History', ''], ['files', 'Files', '']].map(([id, label, n]) => ({
      label, n: String(n || ''), bd: id === tab ? 'var(--accent)' : 'transparent', c: id === tab ? 'var(--text-bright)' : 'var(--text-muted)',
    }));
    return {
      tabs,
      syncText: op ? 'Rebasing onto origin/master' : 'In sync',
      syncColor: op ? 'var(--danger)' : 'var(--success)',
      opDim: op ? 0.45 : 1,
    };
  }
}
</script>
</body>
</html>
