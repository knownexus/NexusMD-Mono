<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Editor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f4f3f0;
  --surface: #ffffff;
  --surface2: #f0efe c;
  --surface3: #e8e7e3;
  --border: rgba(0,0,0,0.08);
  --border-med: rgba(0,0,0,0.14);
  --border-strong: rgba(0,0,0,0.22);
  --text: #111;
  --text-2: #5a5a5a;
  --text-3: #9a9a9a;
  --accent: #2563eb;
  --accent-bg: #eff6ff;
  --accent-light: #dbeafe;
  --green: #15803d;
  --green-bg: #f0fdf4;
  --green-pill: #dcfce7;
  --red: #b91c1c;
  --red-bg: #fef2f2;
  --amber: #92400e;
  --amber-bg: #fffbeb;
  --amber-pill: #fef3c7;
  --purple: #6d28d9;
  --purple-pill: #ede9fe;
  --gray-pill: #f1f0ed;
  --radius: 7px;
  --radius-lg: 11px;
  --header-h: 50px;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  font-size: 13.5px;
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border-med);
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  height: var(--header-h);
  flex-shrink: 0;
  user-select: none;
}

.logo {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 7px;
  margin-right: 6px;
}
.logo-icon {
  width: 26px; height: 26px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 13px;
}

.sep { width: 1px; height: 18px; background: var(--border-med); margin: 0 2px; flex-shrink: 0; }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  white-space: nowrap;
  transition: background 0.1s, color 0.1s, border-color 0.1s;
  line-height: 1;
}
.btn:hover { background: var(--surface3); border-color: var(--border-strong); color: var(--text); }
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; pointer-events: none; }
.btn i { font-size: 14px; }

.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }

.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 99px;
  font-size: 11.5px; font-weight: 600;
}
.badge-valid { background: var(--green-pill); color: var(--green); }
.badge-invalid { background: #fee2e2; color: var(--red); }

/* ── Search ── */
.search-wrap {
  display: flex; align-items: center; gap: 5px;
  padding: 4px 9px;
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  background: var(--bg);
}
.search-wrap:focus-within { border-color: var(--accent); background: var(--surface); }
.search-wrap input {
  border: none; background: transparent;
  color: var(--text); font-size: 12px; font-family: inherit;
  outline: none; width: 140px;
}
.search-wrap input::placeholder { color: var(--text-3); }
.search-wrap i { color: var(--text-3); font-size: 13px; }

/* ── Main layout ── */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
  height: calc(100vh - var(--header-h));
}

.panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--surface);
  min-width: 0;
  transition: flex 0.2s ease;
}

.panel.hidden { display: none; }

.panel-left { border-right: none; flex: 1 1 50%; }
.panel-right { flex: 1 1 50%; }

/* ── Resizer ── */
.resizer {
  width: 5px;
  flex-shrink: 0;
  background: var(--border);
  cursor: col-resize;
  position: relative;
  z-index: 10;
  transition: background 0.15s;
}
.resizer:hover, .resizer.dragging { background: var(--accent); }
.resizer::after {
  content: '';
  position: absolute;
  inset: 0 -4px;
}

/* ── Panel header ── */
.panel-header {
  display: flex; align-items: center; gap: 7px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  font-size: 11.5px;
  color: var(--text-2);
  flex-shrink: 0;
  user-select: none;
}
.panel-header strong { color: var(--text); font-weight: 600; font-size: 12px; }
.panel-header-actions { margin-left: auto; display: flex; gap: 4px; }
.ph-btn {
  width: 24px; height: 24px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: 5px;
  background: transparent; cursor: pointer; color: var(--text-3);
  transition: background 0.1s, color 0.1s;
}
.ph-btn:hover { background: var(--surface3); color: var(--text); border-color: var(--border-med); }

/* ── Path bar ── */
.path-bar {
  padding: 4px 12px;
  font-size: 10.5px;
  color: var(--text-3);
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex-shrink: 0;
  letter-spacing: 0.01em;
}

/* ── Tree ── */
.tree-view {
  flex: 1;
  overflow-y: auto;
  padding: 6px 4px 20px;
}

.node { margin: 0; }

.node-row {
  display: flex; align-items: center;
  padding: 2px 6px 2px 4px;
  border-radius: 5px;
  cursor: default;
  user-select: none;
  min-height: 28px;
  position: relative;
}
.node-row:hover { background: #f5f4f1; }
.node-row.selected { background: var(--accent-bg); }
.node-row.editing { background: var(--accent-bg); outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 5px; }

/* indent guide */
.children {
  padding-left: 18px;
  border-left: 1.5px solid var(--border);
  margin-left: 10px;
}

/* toggle */
.toggle-btn {
  width: 20px; height: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; cursor: pointer;
  color: var(--text-3); border-radius: 4px; flex-shrink: 0; padding: 0;
  transition: color 0.1s, background 0.1s;
}
.toggle-btn:hover { background: var(--surface3); color: var(--text); }
.toggle-spacer { width: 20px; flex-shrink: 0; }

/* key */
.node-key {
  font-weight: 500;
  color: var(--text);
  font-size: 13px;
  flex-shrink: 0;
  letter-spacing: -0.01em;
}

/* separator */
.node-sep {
  color: var(--text-3);
  margin: 0 6px 0 4px;
  font-size: 12px;
  flex-shrink: 0;
}

/* value pills */
.val-pill {
  display: inline-flex; align-items: center;
  padding: 1px 7px;
  border-radius: 4px;
  font-size: 12px;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  letter-spacing: 0;
  max-width: 320px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.val-string { background: var(--green-pill); color: #166534; }
.val-number { background: var(--amber-pill); color: #78350f; }
.val-bool-true { background: var(--accent-light); color: #1e40af; }
.val-bool-false { background: var(--gray-pill); color: var(--text-2); }
.val-null { background: var(--gray-pill); color: var(--text-3); font-style: italic; }

/* container summary */
.val-summary {
  font-size: 11.5px;
  color: var(--text-3);
  font-style: normal;
  background: var(--gray-pill);
  padding: 1px 7px;
  border-radius: 4px;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
}

/* type badge (small) */
.type-tag {
  font-size: 9.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 1px 5px;
  border-radius: 3px;
  margin-left: 5px;
  flex-shrink: 0;
  opacity: 0.7;
}
.tag-str { background: var(--green-pill); color: #166534; }
.tag-num { background: var(--amber-pill); color: #78350f; }
.tag-bool { background: var(--purple-pill); color: var(--purple); }
.tag-null { background: var(--gray-pill); color: var(--text-3); }
.tag-obj { background: var(--accent-light); color: #1e40af; }
.tag-arr { background: #fce7f3; color: #9d174d; }

/* actions */
.node-actions { margin-left: auto; display: none; gap: 1px; padding-left: 6px; flex-shrink: 0; }
.node-row:hover .node-actions { display: flex; }
.icon-btn {
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; cursor: pointer;
  color: var(--text-3); border-radius: 4px; padding: 0;
  transition: background 0.1s, color 0.1s;
  font-size: 13px;
}
.icon-btn:hover { background: var(--surface3); color: var(--text); }
.icon-btn.del:hover { color: var(--red); background: var(--red-bg); }
.icon-btn.add-btn:hover { color: var(--green); background: var(--green-bg); }

/* inline edit */
.inline-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 13px;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  outline: none;
  min-width: 60px;
  padding: 0 2px;
}

/* ── Raw panel ── */
.raw-panel { border-left: none; }
.raw-editor-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

#rawEditor {
  flex: 1;
  border: none; resize: none;
  background: #1a1b26;
  color: #a9b1d6;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  font-size: 12.5px;
  padding: 14px 18px;
  outline: none;
  line-height: 1.65;
  tab-size: 2;
}

.error-bar {
  padding: 7px 14px;
  font-size: 11.5px;
  color: var(--red);
  background: var(--red-bg);
  border-top: 1px solid #fecaca;
  font-family: 'SF Mono', 'Fira Code', monospace;
  display: none;
  flex-shrink: 0;
}

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-med);
  padding: 1.4rem 1.5rem;
  width: 340px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.14);
}
.modal h3 { font-size: 14.5px; font-weight: 600; margin-bottom: 16px; }
.modal label {
  display: block; font-size: 11px; color: var(--text-3);
  margin-bottom: 5px; margin-top: 13px;
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
}
.modal input, .modal select {
  width: 100%; padding: 7px 10px;
  border: 1px solid var(--border-med);
  border-radius: var(--radius);
  font-size: 13px; font-family: inherit;
  background: var(--surface); color: var(--text);
  outline: none; transition: border-color 0.15s;
}
.modal input:focus, .modal select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(60px);
  background: #111; color: #fff;
  padding: 7px 16px; border-radius: 99px;
  font-size: 12.5px;
  opacity: 0; transition: transform 0.18s, opacity 0.18s;
  z-index: 300; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

mark { background: #fde68a; border-radius: 2px; padding: 0 1px; color: inherit; }

/* modal value field variants */
.val-field { margin-top: 12px; }
.val-hint {
  font-size: 10px; color: var(--text-3); font-weight: 400;
  text-transform: none; letter-spacing: 0; margin-left: 4px;
}
.info-box {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 10px 12px;
  background: var(--accent-bg);
  border: 1px solid var(--accent-light);
  border-radius: var(--radius);
  font-size: 12.5px; color: var(--text-2); line-height: 1.5;
}
.info-box i { color: var(--accent); font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.info-box code { background: var(--accent-light); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; color: var(--accent); }

/* boolean toggle */
.bool-toggle-wrap { display: flex; gap: 8px; margin-top: 5px; }
.bool-opt {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 0;
  border: 1.5px solid var(--border-med);
  border-radius: var(--radius);
  background: var(--surface2);
  color: var(--text-2);
  cursor: pointer; font-size: 13.5px; font-family: inherit; font-weight: 500;
  transition: background 0.12s, border-color 0.12s, color 0.12s;
}
.bool-opt:hover { background: var(--surface3); }
.bool-opt.active-true { background: var(--accent-light); border-color: var(--accent); color: #1e40af; }
.bool-opt.active-false { background: var(--gray-pill); border-color: var(--border-strong); color: var(--text); }

/* number input — hide browser spinners for a cleaner look */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { opacity: 1; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 99px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-code"></i></div>
    JSON Editor
  </div>

  <div class="sep"></div>
  <button class="btn" id="btnUndo" onclick="undo()" title="Ctrl+Z"><i class="ti ti-arrow-back-up"></i> Undo</button>
  <button class="btn" id="btnRedo" onclick="redo()" title="Ctrl+Y"><i class="ti ti-arrow-forward-up"></i> Redo</button>

  <div class="sep"></div>
  <button class="btn" onclick="expandAll()"><i class="ti ti-arrows-maximize"></i> Expand</button>
  <button class="btn" onclick="collapseAll()"><i class="ti ti-arrows-minimize"></i> Collapse</button>

  <div class="sep"></div>
  <div class="search-wrap">
    <i class="ti ti-search"></i>
    <input id="searchInput" placeholder="Search…" oninput="doSearch(this.value)" />
  </div>

  <div class="toolbar-right">
    <span id="validBadge" class="badge badge-valid"><i class="ti ti-circle-check"></i> Valid JSON</span>
    <div class="sep"></div>
    <label class="btn" title="Open file" style="cursor:pointer">
      <i class="ti ti-upload"></i> Open
      <input type="file" accept=".json" onchange="openFile(event)" style="display:none">
    </label>
    <button class="btn" onclick="copyJSON()"><i class="ti ti-copy"></i> Copy</button>
    <button class="btn btn-primary" onclick="downloadJSON()" title="Ctrl+S"><i class="ti ti-download"></i> Save</button>
  </div>
</header>

<main class="main" id="mainLayout">

  <!-- Visual editor -->
  <div class="panel panel-left" id="panelLeft">
    <div class="panel-header">
      <i class="ti ti-list-tree" style="font-size:14px"></i>
      <strong>Visual editor</strong>
      <span style="color:var(--text-3);font-size:11px;margin-left:2px">· double-click any row to edit</span>
      <div class="panel-header-actions">
        <button class="ph-btn" onclick="addRootField()" title="Add field"><i class="ti ti-plus"></i></button>
        <button class="ph-btn" id="hideLeftBtn" onclick="togglePanel('left')" title="Hide panel"><i class="ti ti-layout-sidebar-left-collapse"></i></button>
      </div>
    </div>
    <div class="path-bar" id="pathBar">root</div>
    <div class="tree-view" id="treeView"></div>
  </div>

  <!-- Drag resizer -->
  <div class="resizer" id="resizer"></div>

  <!-- Raw editor -->
  <div class="panel panel-right raw-panel" id="panelRight">
    <div class="panel-header">
      <i class="ti ti-code" style="font-size:14px"></i>
      <strong>Raw JSON</strong>
      <div class="panel-header-actions">
        <button class="ph-btn" onclick="formatRaw()" title="Format JSON"><i class="ti ti-wand"></i></button>
        <button class="ph-btn" id="hideRightBtn" onclick="togglePanel('right')" title="Hide panel"><i class="ti ti-layout-sidebar-right-collapse"></i></button>
      </div>
    </div>
    <div class="raw-editor-wrap">
      <textarea id="rawEditor" spellcheck="false"
        onkeyup="onRawChange()" onpaste="setTimeout(onRawChange,10)"
        placeholder="Paste or type JSON here…"></textarea>
      <div class="error-bar" id="errorBar"></div>
    </div>
  </div>

</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modalTitle">Edit field</h3>

    <label>Key</label>
    <input id="mKey" placeholder="e.g. username" />

    <label>Type</label>
    <select id="mType" onchange="onTypeChange()">
      <option value="string">Text (string)</option>
      <option value="number">Number</option>
      <option value="boolean">True / False (boolean)</option>
      <option value="null">Empty (null)</option>
      <option value="object">Group (object { })</option>
      <option value="array">List (array [ ])</option>
    </select>

    <!-- String -->
    <div id="mFieldString" class="val-field">
      <label>Value <span class="val-hint">any text</span></label>
      <input id="mValString" placeholder="Enter text…" />
    </div>

    <!-- Number -->
    <div id="mFieldNumber" class="val-field" style="display:none">
      <label>Value <span class="val-hint">must be numeric</span></label>
      <input id="mValNumber" type="number" step="any" placeholder="e.g. 42" />
    </div>

    <!-- Boolean toggle -->
    <div id="mFieldBoolean" class="val-field" style="display:none">
      <label>Value</label>
      <div class="bool-toggle-wrap">
        <button class="bool-opt" id="boolTrue" onclick="setBool(true)">
          <i class="ti ti-check"></i> true
        </button>
        <button class="bool-opt" id="boolFalse" onclick="setBool(false)">
          <i class="ti ti-x"></i> false
        </button>
      </div>
    </div>

    <!-- Null info -->
    <div id="mFieldNull" class="val-field info-box" style="display:none">
      <i class="ti ti-info-circle"></i>
      This field will be set to <code>null</code> — it exists but has no value.
    </div>

    <!-- Object info -->
    <div id="mFieldObject" class="val-field info-box" style="display:none">
      <i class="ti ti-info-circle"></i>
      Creates an empty group <code>{ }</code>. You can add fields inside it after saving.
    </div>

    <!-- Array info -->
    <div id="mFieldArray" class="val-field info-box" style="display:none">
      <i class="ti ti-info-circle"></i>
      Creates an empty list <code>[ ]</code>. You can add items inside it after saving.
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitModal()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SAMPLE = {
  "name": "Alice Johnson",
  "age": 28,
  "active": true,
  "role": null,
  "address": { "street": "12 Oak Avenue", "city": "Bristol", "postcode": "BS1 4QX" },
  "tags": ["developer", "designer", "mentor"],
  "score": 94.5
};

let data = JSON.parse(JSON.stringify(SAMPLE));
let collapsed = new Set();
let history = [JSON.stringify(data)];
let histIdx = 0;
let searchTerm = '';
let modalCallback = null;
let hiddenPanels = { left: false, right: false };

const treeView = document.getElementById('treeView');
const rawEditor = document.getElementById('rawEditor');
const errorBar = document.getElementById('errorBar');
const validBadge = document.getElementById('validBadge');
const pathBar = document.getElementById('pathBar');
const toast = document.getElementById('toast');
let toastTimer;

function showToast(msg) {
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

// ── Panel show/hide + resize ──────────────────────────────────────────────────
function togglePanel(side) {
  const panelLeft = document.getElementById('panelLeft');
  const panelRight = document.getElementById('panelRight');
  const resizer = document.getElementById('resizer');
  const btn = document.getElementById(side === 'left' ? 'hideLeftBtn' : 'hideRightBtn');

  hiddenPanels[side] = !hiddenPanels[side];

  if (hiddenPanels.left) {
    panelLeft.style.display = 'none';
    resizer.style.display = 'none';
    panelRight.style.flex = '1 1 100%';
    document.getElementById('hideRightBtn').querySelector('i').className = 'ti ti-layout-sidebar-right';
  } else {
    panelLeft.style.display = '';
  }
  if (hiddenPanels.right) {
    panelRight.style.display = 'none';
    resizer.style.display = 'none';
    panelLeft.style.flex = '1 1 100%';
    document.getElementById('hideLeftBtn').querySelector('i').className = 'ti ti-layout-sidebar-left';
  } else {
    panelRight.style.display = '';
  }
  if (!hiddenPanels.left && !hiddenPanels.right) {
    resizer.style.display = '';
    panelLeft.style.flex = '';
    panelRight.style.flex = '';
    // reset to saved widths
    if (savedLeftW) {
      panelLeft.style.flex = `0 0 ${savedLeftW}px`;
      panelRight.style.flex = `0 0 calc(100% - ${savedLeftW}px - 5px)`;
    }
    document.getElementById('hideLeftBtn').querySelector('i').className = 'ti ti-layout-sidebar-left-collapse';
    document.getElementById('hideRightBtn').querySelector('i').className = 'ti ti-layout-sidebar-right-collapse';
  }
}

// Drag-to-resize
let savedLeftW = null;
const resizer = document.getElementById('resizer');
const main = document.getElementById('mainLayout');
let isResizing = false;

resizer.addEventListener('mousedown', e => {
  isResizing = true;
  resizer.classList.add('dragging');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
});

document.addEventListener('mousemove', e => {
  if (!isResizing) return;
  const rect = main.getBoundingClientRect();
  let leftW = e.clientX - rect.left;
  leftW = Math.max(180, Math.min(rect.width - 185, leftW));
  savedLeftW = leftW;
  const panelLeft = document.getElementById('panelLeft');
  const panelRight = document.getElementById('panelRight');
  panelLeft.style.flex = `0 0 ${leftW}px`;
  panelRight.style.flex = `0 0 ${rect.width - leftW - 5}px`;
});

document.addEventListener('mouseup', () => {
  if (!isResizing) return;
  isResizing = false;
  resizer.classList.remove('dragging');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
});

// ── History ───────────────────────────────────────────────────────────────────
function push(d) {
  history = history.slice(0, histIdx + 1);
  history.push(typeof d === 'string' ? d : JSON.stringify(d));
  histIdx = history.length - 1;
  updateUndoRedo();
}
function undo() { if (histIdx > 0) { histIdx--; applyHistory(); } }
function redo() { if (histIdx < history.length - 1) { histIdx++; applyHistory(); } }
function applyHistory() {
  data = JSON.parse(history[histIdx]);
  rawEditor.value = JSON.stringify(data, null, 2);
  renderTree(); updateUndoRedo();
}
function updateUndoRedo() {
  document.getElementById('btnUndo').disabled = histIdx === 0;
  document.getElementById('btnRedo').disabled = histIdx === history.length - 1;
}

// ── Tree rendering ────────────────────────────────────────────────────────────
function renderTree() {
  treeView.innerHTML = '';
  treeView.appendChild(renderNode(data, 'root', []));
}

function typeOf(val) {
  if (Array.isArray(val)) return 'array';
  if (val === null) return 'null';
  return typeof val;
}

function renderNode(val, keyLabel, path) {
  const wrap = document.createElement('div');
  wrap.className = 'node';

  const row = document.createElement('div');
  row.className = 'node-row';
  row.dataset.path = path.join('.');

  const type = typeOf(val);
  const pathKey = path.join('.');
  const isContainer = type === 'object' || type === 'array';

  // Toggle
  if (isContainer) {
    const toggle = document.createElement('button');
    toggle.className = 'toggle-btn';
    toggle.setAttribute('aria-label', collapsed.has(pathKey) ? 'expand' : 'collapse');
    toggle.innerHTML = collapsed.has(pathKey)
      ? '<i class="ti ti-chevron-right" style="font-size:11px"></i>'
      : '<i class="ti ti-chevron-down" style="font-size:11px"></i>';
    toggle.onclick = e => {
      e.stopPropagation();
      collapsed.has(pathKey) ? collapsed.delete(pathKey) : collapsed.add(pathKey);
      renderTree();
    };
    row.appendChild(toggle);
  } else {
    const sp = document.createElement('span'); sp.className = 'toggle-spacer';
    row.appendChild(sp);
  }

  // Key
  if (keyLabel !== 'root') {
    const kSpan = document.createElement('span');
    kSpan.className = 'node-key';
    kSpan.innerHTML = highlightHTML(String(keyLabel));
    row.appendChild(kSpan);

    const sep = document.createElement('span');
    sep.className = 'node-sep';
    sep.textContent = '→';
    row.appendChild(sep);
  }

  // Value / summary
  if (isContainer) {
    const isCollapsed = collapsed.has(pathKey);
    const summary = document.createElement('span');
    summary.className = 'val-summary';
    if (type === 'object') {
      const n = Object.keys(val).length;
      summary.textContent = isCollapsed ? `{ ${n} field${n !== 1 ? 's' : ''} }` : '{ … }';
    } else {
      summary.textContent = isCollapsed ? `[ ${val.length} item${val.length !== 1 ? 's' : ''} ]` : '[ … ]';
    }
    row.appendChild(summary);
  } else {
    const pill = document.createElement('span');
    if (type === 'string') {
      pill.className = 'val-pill val-string';
      pill.innerHTML = highlightHTML(val);
    } else if (type === 'number') {
      pill.className = 'val-pill val-number';
      pill.innerHTML = highlightHTML(String(val));
    } else if (type === 'boolean') {
      pill.className = `val-pill ${val ? 'val-bool-true' : 'val-bool-false'}`;
      pill.textContent = String(val);
    } else {
      pill.className = 'val-pill val-null';
      pill.textContent = 'null';
    }
    row.appendChild(pill);
  }

  // Actions
  const actions = document.createElement('div');
  actions.className = 'node-actions';

  if (isContainer) {
    const addBtn = document.createElement('button');
    addBtn.className = 'icon-btn add-btn'; addBtn.title = 'Add field here';
    addBtn.innerHTML = '<i class="ti ti-plus"></i>';
    addBtn.onclick = e => { e.stopPropagation(); openAddModal(path, type); };
    actions.appendChild(addBtn);
  }

  const editBtn = document.createElement('button');
  editBtn.className = 'icon-btn'; editBtn.title = 'Edit (or double-click)';
  editBtn.innerHTML = '<i class="ti ti-edit"></i>';
  editBtn.onclick = e => { e.stopPropagation(); openEditModal(path, keyLabel, val); };
  actions.appendChild(editBtn);

  if (path.length > 0) {
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del'; delBtn.title = 'Delete';
    delBtn.innerHTML = '<i class="ti ti-trash"></i>';
    delBtn.onclick = e => {
      e.stopPropagation();
      if (confirm(`Delete "${keyLabel}"?`)) deleteNode(path);
    };
    actions.appendChild(delBtn);
  }
  row.appendChild(actions);

  // Click → select + path
  row.onclick = () => {
    pathBar.textContent = path.length ? '/ ' + path.join(' / ') : '/';
    document.querySelectorAll('.node-row.selected').forEach(r => r.classList.remove('selected'));
    row.classList.add('selected');
  };

  // Double-click → edit
  row.ondblclick = e => {
    if (e.target.closest('button')) return;
    e.preventDefault();
    // For primitive values: inline edit
    if (!isContainer && path.length > 0) {
      startInlineEdit(row, path, keyLabel, val, type);
    } else {
      openEditModal(path, keyLabel, val);
    }
  };

  wrap.appendChild(row);

  if (isContainer && !collapsed.has(pathKey)) {
    const children = document.createElement('div');
    children.className = 'children';
    if (type === 'object') {
      for (const [k, v] of Object.entries(val)) children.appendChild(renderNode(v, k, [...path, k]));
    } else {
      val.forEach((v, i) => children.appendChild(renderNode(v, i, [...path, i])));
    }
    wrap.appendChild(children);
  }
  return wrap;
}

// ── Inline editing ────────────────────────────────────────────────────────────
function startInlineEdit(row, path, keyLabel, curVal, type) {
  row.classList.add('editing');
  // Hide the value pill
  const pill = row.querySelector('.val-pill');
  if (!pill) return;
  const originalHTML = pill.outerHTML;
  pill.style.display = 'none';

  const input = document.createElement('input');
  input.className = 'inline-input';
  input.value = curVal === null ? '' : String(curVal);
  input.placeholder = type === 'number' ? '0' : type === 'boolean' ? 'true / false' : '';

  // insert after pill
  pill.insertAdjacentElement('afterend', input);
  input.focus();
  input.select();

  function commit() {
    const raw = input.value;
    let newVal;
    if (type === 'number') newVal = isNaN(Number(raw)) ? curVal : Number(raw);
    else if (type === 'boolean') newVal = raw.toLowerCase() !== 'false' && raw !== '0' && raw !== '';
    else newVal = raw;

    setNodeValue(path, newVal);
    push(data); syncRaw(); renderTree();
  }

  function cancel() {
    row.classList.remove('editing');
    input.remove();
    pill.style.display = '';
  }

  input.onblur = commit;
  input.onkeydown = e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.onblur = null; cancel(); }
    e.stopPropagation();
  };
}

function setNodeValue(path, val) {
  if (path.length === 0) { data = val; return; }
  let cur = data;
  for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
  cur[path[path.length - 1]] = val;
}

// ── Highlight search ──────────────────────────────────────────────────────────
function highlightHTML(text) {
  const esc = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if (!searchTerm) return esc;
  const re = new RegExp(searchTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return esc.replace(re, m => `<mark>${m}</mark>`);
}

// ── Data helpers ──────────────────────────────────────────────────────────────
function getNode(path) { let c = data; for (const k of path) c = c[k]; return c; }

function deleteNode(path) {
  if (path.length === 0) return;
  let cur = data;
  for (let i = 0; i < path.length - 1; i++) cur = cur[path[i]];
  const k = path[path.length - 1];
  if (Array.isArray(cur)) cur.splice(k, 1); else delete cur[k];
  push(data); syncRaw(); renderTree();
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openAddModal(path, containerType) {
  document.getElementById('mKey').value = '';
  document.getElementById('mKey').disabled = containerType === 'array';
  if (containerType === 'array') document.getElementById('mKey').value = '(auto-index)';
  document.getElementById('mVal').value = '';
  document.getElementById('mType').value = 'string';
  document.getElementById('modalTitle').textContent = 'Add field';
  onTypeChange();
  modalCallback = () => {
    const key = containerType === 'array' ? null : document.getElementById('mKey').value.trim();
    const type = document.getElementById('mType').value;
    const val = coerceVal(type, document.getElementById('mVal').value);
    const target = path.length ? getNode(path) : data;
    if (containerType === 'array') target.push(val);
    else if (key) target[key] = val;
    push(data); syncRaw(); renderTree();
  };
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => document.getElementById(containerType === 'array' ? 'mVal' : 'mKey').focus(), 50);
}

function openEditModal(path, keyLabel, curVal) {
  const type = typeOf(curVal) === 'object' ? 'object' : typeOf(curVal);
  document.getElementById('mKey').value = keyLabel;
  document.getElementById('mKey').disabled = path.length > 0 && typeof path[path.length - 1] === 'number';
  document.getElementById('mType').value = type;
  document.getElementById('mVal').value = (type === 'string' || type === 'number' || type === 'boolean') ? String(curVal) : '';
  document.getElementById('modalTitle').textContent = path.length === 0 ? 'Edit root' : `Edit "${keyLabel}"`;
  onTypeChange();
  modalCallback = () => {
    const newKey = document.getElementById('mKey').value.trim();
    const newType = document.getElementById('mType').value;
    const newVal = coerceVal(newType, document.getElementById('mVal').value);
    if (path.length === 0) { data = newVal; push(data); syncRaw(); renderTree(); return; }
    const parentPath = path.slice(0, -1);
    const oldKey = path[path.length - 1];
    const parent = parentPath.length ? getNode(parentPath) : data;
    if (Array.isArray(parent)) {
      parent[oldKey] = newVal;
    } else {
      if (newKey !== String(oldKey)) {
        const entries = Object.entries(parent);
        const idx = entries.findIndex(([k]) => k === String(oldKey));
        entries[idx] = [newKey, newVal];
        for (const k of Object.keys(parent)) delete parent[k];
        for (const [k, v] of entries) parent[k] = v;
      } else {
        parent[oldKey] = newVal;
      }
    }
    push(data); syncRaw(); renderTree();
  };
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => {
    const mv = document.getElementById('mVal');
    if (mv.style.display !== 'none') mv.focus(); else document.getElementById('mKey').focus();
  }, 50);
}

function addRootField() { openAddModal([], Array.isArray(data) ? 'array' : 'object'); }

function coerceVal(type, raw) {
  if (type === 'string') return raw;
  if (type === 'number') return isNaN(Number(raw)) ? 0 : Number(raw);
  if (type === 'boolean') return raw.toLowerCase() === 'true' || raw === '1';
  if (type === 'null') return null;
  if (type === 'object') return {};
  if (type === 'array') return [];
}

let _boolVal = true;
function setBool(v) {
  _boolVal = v;
  document.getElementById('boolTrue').className = 'bool-opt' + (v ? ' active-true' : '');
  document.getElementById('boolFalse').className = 'bool-opt' + (!v ? ' active-false' : '');
}

function onTypeChange() {
  const t = document.getElementById('mType').value;
  ['String','Number','Boolean','Null','Object','Array'].forEach(f => {
    const el = document.getElementById('mField' + f);
    if (el) el.style.display = 'none';
  });
  const key = t.charAt(0).toUpperCase() + t.slice(1);
  const show = document.getElementById('mField' + key);
  if (show) show.style.display = '';
  setTimeout(() => {
    if (t === 'string') document.getElementById('mValString').focus();
    else if (t === 'number') document.getElementById('mValNumber').focus();
  }, 40);
}

function getModalValue() {
  const t = document.getElementById('mType').value;
  if (t === 'string') return document.getElementById('mValString').value;
  if (t === 'number') {
    const v = document.getElementById('mValNumber').value;
    return v === '' ? 0 : Number(v);
  }
  if (t === 'boolean') return _boolVal;
  if (t === 'null') return null;
  if (t === 'object') return {};
  if (t === 'array') return [];
}

function setModalValue(type, val) {
  if (type === 'string') document.getElementById('mValString').value = val == null ? '' : String(val);
  if (type === 'number') document.getElementById('mValNumber').value = val == null ? '' : String(val);
  if (type === 'boolean') setBool(val === true);
}

function submitModal() { if (modalCallback) modalCallback(); closeModal(); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); modalCallback = null; }

// ── Raw editor ────────────────────────────────────────────────────────────────
function onRawChange() {
  try {
    data = JSON.parse(rawEditor.value);
    errorBar.style.display = 'none';
    validBadge.className = 'badge badge-valid';
    validBadge.innerHTML = '<i class="ti ti-circle-check"></i> Valid JSON';
    push(data); renderTree();
  } catch (e) {
    errorBar.style.display = 'block';
    errorBar.textContent = '⚠ ' + e.message;
    validBadge.className = 'badge badge-invalid';
    validBadge.innerHTML = '<i class="ti ti-alert-circle"></i> Invalid';
  }
}

function syncRaw() {
  rawEditor.value = JSON.stringify(data, null, 2);
  errorBar.style.display = 'none';
  validBadge.className = 'badge badge-valid';
  validBadge.innerHTML = '<i class="ti ti-circle-check"></i> Valid JSON';
}

function formatRaw() {
  try {
    const parsed = JSON.parse(rawEditor.value);
    rawEditor.value = JSON.stringify(parsed, null, 2);
    data = parsed; push(data); renderTree();
    errorBar.style.display = 'none';
    showToast('Formatted ✓');
  } catch (e) {
    errorBar.style.display = 'block';
    errorBar.textContent = 'Cannot format — fix errors first: ' + e.message;
  }
}

// ── Expand / Collapse ─────────────────────────────────────────────────────────
function expandAll() { collapsed.clear(); renderTree(); }
function collapseAll() {
  function walk(val, path) {
    const t = typeOf(val);
    if (t === 'object' || t === 'array') {
      collapsed.add(path.join('.'));
      if (t === 'object') for (const [k, v] of Object.entries(val)) walk(v, [...path, k]);
      else val.forEach((v, i) => walk(v, [...path, i]));
    }
  }
  collapsed.clear(); walk(data, []); renderTree();
}

// ── Search ────────────────────────────────────────────────────────────────────
function doSearch(term) { searchTerm = term.trim(); renderTree(); }

// ── Copy / Download / Open ────────────────────────────────────────────────────
function copyJSON() {
  navigator.clipboard.writeText(JSON.stringify(data, null, 2))
    .then(() => showToast('Copied to clipboard ✓'));
}

function downloadJSON() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'data.json'; a.click();
  showToast('Downloaded ✓');
}

function openFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      data = JSON.parse(ev.target.result);
      syncRaw(); push(data); renderTree();
      showToast(`Opened: ${file.name}`);
    } catch { showToast('Error: invalid JSON file'); }
  };
  reader.readAsText(file); e.target.value = '';
}

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const modal = document.getElementById('modalOverlay').classList.contains('open');
  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey && !modal) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey)) && !modal) { e.preventDefault(); redo(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); downloadJSON(); }
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && modal) { e.preventDefault(); submitModal(); }
});

// ── Init ──────────────────────────────────────────────────────────────────────
syncRaw();
renderTree();
updateUndoRedo();
</script>
</body>
</html>
